# External sources. All URLs pinned to immutable refs (tags or commit SHAs)
# so a fresh install cannot break because upstream shipped a breaking change.
# Bump these deliberately, not implicitly.

# zsh plugins: sourced directly from .local/share/zsh-plugins
# (not via oh-my-zsh). Pinned to specific release tags.

[".local/share/zsh-plugins/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/0.8.0.tar.gz"
exact = true
stripComponents = 1

[".local/share/zsh-plugins/zsh-autosuggestions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/v0.7.1.tar.gz"
exact = true
stripComponents = 1
